# =====================================================================
#  DIVISIONE OPZIONI — Configurazione
#
#  Terza divisione, su conto paper separato (PA3NW0SCZK7E).
#
#  SECONDO CONTO dal 2026-09-15. Il primo (PA3YKSS69ZE0) e' passato da 550$ a
#  249$ in due settimane con le regole vecchie: contratto fino al 70% del
#  capitale, opzioni tenute nel weekend, freno senza ripartenza. Resta aperto e
#  intatto come archivio; il suo storico e' in state/options/archivio/.
#  Si riparte da zero su un conto nuovo per misurare le regole nuove senza
#  mescolarle con i risultati di quelle vecchie.
#
#  SCOPO: confronto A/B. Usa lo STESSO segnale della divisione azioni
#  (la selezione della Routine 01) ma lo esprime comprando opzioni invece
#  che azioni. Cosi' l'unica variabile che cambia e' lo strumento, e la
#  domanda diventa netta: lo stesso segnale rende di piu' in opzioni?
#
#  Non c'e' un segnale nuovo. Se ne inventassimo uno, un risultato diverso
#  non ci direbbe se il merito e' dello strumento o della selezione.
# =====================================================================

meta:
  division: options
  paper_trading: true
  account_hint: PA3NW0SCZK7E     # se il conto non e' questo, si ferma
  base_currency: USD
  timezone: Europe/Rome
  market_timezone: America/New_York
  secrets_file: secrets/alpaca_options_keys.env

capital:
  base_usd: 0                    # 0 = usa l'equity reale (il conto e' nato con 550)
  initial_usd: 550
  strategy_start: "2026-09-16T00:00:00Z"   # conto nuovo e regole nuove
  min_usd: 100                   # sotto questa soglia un contratto non e' piu' comprabile

# --- Universo PROPRIO ----------------------------------------------------
# Non si eredita piu' l'universo azionario: li' un contratto vicino al denaro
# costa spesso piu' del nostro intero capitale (HOOD 562$, QCOM 578$), oppure
# il titolo e' cosi' sottile che lo spread arriva al 132%.
#
# Questi 30 sono stati scelti MISURANDO la liquidita' delle loro OPZIONI, non
# delle azioni: per ognuno esiste un contratto entro il 5% dal denaro, sotto i
# 385 dollari e con spread sotto l'8%. Vanno riverificati ogni tanto, perche'
# prezzi e liquidita' cambiano.
universe:
  tickers: [BABA, BAC, BMY, CCL, CSCO, CVS, DAL, DIS, DKNG, EEM, GM, HPQ, INTC,
            KO, NFLX, NKE, PFE, RIOT, RIVN, SLV, SMCI, SOFI, T, UAL, UBER, VZ,
            WFC, WMT, XLE, XLF]
  top_candidates: 5

# --- Le due modalita' ---------------------------------------------------
modes:
  # INTRADAY: apre e chiude nella stessa giornata. Consuma i crediti PDT.
  # Riservato al candidato piu' forte, quando il movimento e' ampio abbastanza
  # da giustificare il costo dello strumento.
  intraday:
    enabled: true
    min_gap_pct: 3.0             # sotto questo scarto non vale la pena
    only_top_rank: 1             # solo il candidato numero uno
    # MAI una scadenza nel giorno stesso (era 0 fino al 2026-09-16).
    # Il 16 settembre l'intraday ha comprato una call INTC in scadenza quel
    # giorno, strike 103 con il titolo a 100,69. Un contratto che scade fra
    # poche ore non ha piu' valore di tempo: INTC e' sceso a 99,29 subito dopo
    # l'acquisto, il premio ha perso il 65% e la protezione e' scattata. Poi il
    # titolo e' salito fino a 104,42 — la direzione era giusta — ma eravamo gia'
    # usciti a -80$, e quel contratto a fine giornata valeva 1 centesimo.
    # Con la scadenza a 2 giorni lo stesso contratto costava 133$ invece di 127$
    # e un calo dell'1,4% non lo avrebbe fatto scendere del 65%.
    # Misurato: la finestra 2-9 giorni lascia 16 titoli acquistabili su 30,
    # contro i 13 della finestra 0-7. Non costa opportunita'.
    expiry_min_days: 2
    expiry_max_days: 9
    # La chiusura NON e' piu' un orario italiano fisso: vedi il blocco session.
    max_premium_pct: 0.25        # quota massima del capitale in un contratto

  # SWING: tenute piu' giorni. NON consumano crediti PDT (il conteggio
  # scatta solo su apri-e-chiudi nella stessa giornata). E' il grosso
  # dell'attivita' e continua anche a crediti esauriti.
  swing:
    enabled: true
    expiry_min_days: 14          # lontano dalla scadenza: il decadimento
    expiry_max_days: 35          # temporale su 5 giorni resta sopportabile
    max_hold_days: 7             # due giorni piu' delle azioni: serve spazio
    # TETTO PER SINGOLO CONTRATTO: dal 70% al 25% il 2026-09-15.
    # Col 70% una perdita normale per un'opzione (50-70% del premio) diventava
    # la perdita di mezzo conto: INTC valeva il 62% del capitale e ha perso il
    # 68%, cioe' $292 in un colpo. Al 25% la stessa perdita costa circa un sesto
    # del conto. Si possono avere piu' posizioni insieme, ma nessuna da sola puo'
    # piu' dimezzare il capitale.
    max_premium_pct: 0.25
    # Il vincolo vero e' sull'IMPORTO complessivo, non sul numero: se i contratti
    # sono economici se ne tengono piu' d'uno, purche' la somma dei premi resti
    # entro il tetto.
    max_total_premium_pct: 0.75
    max_positions: 3             # tre contratti al 25% riempiono il tetto

# --- Scelta del contratto ----------------------------------------------
contract:
  type: call                     # solo acquisto: perdita massima = premio
  strike_offset: 0               # 0 = al denaro; 1 = uno sopra (piu' economico)
  max_spread_pct: 8.0            # piu' permissivo della soglia usata sulle azioni
  min_open_interest: 100         # contratti poco scambiati non si rivendono
  min_premium_usd: 20            # sotto, il contratto e' una scommessa da lotteria
  # Il contratto deve stare VICINO al denaro: il segnale azionario punta a +6%,
  # e un contratto molto fuori dal denaro pagherebbe solo con il doppio di quel
  # movimento. Comprarlo sarebbe cambiare la scommessa, non lo strumento.
  max_otm_pct: 5.0
  max_premium_usd: 400

# --- Uscite: SPECULARI a quelle azionarie -------------------------------
# I livelli si misurano sul SOTTOSTANTE, non sul premio: cosi' il confronto
# con la divisione azioni resta pulito. Il valore dell'opzione fa quello che
# fa, ma la decisione di uscire nasce dallo stesso identico evento.
# PIU' AGGRESSIVO della divisione azioni, per scelta esplicita: lo stop resta
# stretto (-3%, la perdita e' comunque limitata al premio) ma l'obiettivo e'
# piu' lontano. Con un rendimento convesso, chiudere a +6% come le azioni
# taglierebbe proprio le operazioni che giustificano lo strumento.
exits:
  underlying_stop_pct: 0.03      # -3% sul titolo
  underlying_target_pct: 0.08    # +8%: si lascia piu' spazio al movimento
  premium_stop_pct: 0.50         # rete di sicurezza: -50% sul premio, si esce
  premium_target_pct: 1.00       # +100% sul premio: si incassa comunque

  # TRAILING SUL PREMIO. Senza, un guadagno inferiore al 100% non era protetto
  # da nulla: una posizione arrivata a +60% poteva tornare a zero e non si
  # incassava niente. Con la convessita' e' un caso frequente, non raro — un
  # guadagno costruito in due giorni puo' svanire in poche ore.
  #
  # Si attiva solo oltre la soglia, cosi' le oscillazioni normali dei primi
  # momenti non chiudono la posizione. Da li' in poi si esce se il premio
  # restituisce meta' del guadagno massimo raggiunto: i vincitori continuano a
  # correre senza tetto, ma smettono di poter restituire tutto.
  # Abbassata da 0,40 a 0,25 il 2026-09-09: con la soglia al 40% una posizione
  # arrivata a +38% (XLE) ha restituito tutto senza che nulla intervenisse.
  premium_trail_activate_pct: 0.25   # protezione attiva oltre il +25%
  premium_trail_giveback_pct: 0.50   # si esce restituendo meta' del massimo

# --- Blocco del profitto a livello di CONTO ------------------------------
# Le protezioni sopra sono tutte per POSIZIONE. Nessuna guardava il totale, e
# infatti il conto e' salito a 829$ ed e' tornato a 694$ senza che scattasse
# nulla: il picco era la somma di tre posizioni, nessuna delle quali aveva
# toccato la propria soglia.
#
# Qui la regola mancante: quando l'equity supera la base di 95 dollari si
# liquida TUTTO e quel guadagno diventa la nuova base.
#
# Obiettivo dichiarato dall'utente: incassi frequenti e certi, non guadagni
# grandi e sospesi. Il costo e' altrettanto dichiarato — se una posizione
# sarebbe andata molto oltre, quel resto non lo prendiamo.
#
# CORREZIONE del 2026-09-12. La prima versione spostava la base ma lasciava il
# denaro nel giro: il dimensionamento si calcolava sull'equity totale. Il 9
# settembre il conto ha "messo al sicuro" 141,60$ e li ha rimessi a rischio 75
# minuti dopo, perdendo tutto entro il giorno seguente. Realizzare un guadagno e
# reinvestirlo subito non lo protegge: cambia solo la contabilita'.
#
# Con reinvest_pct a 0 il guadagno incassato resta liquido e NON rientra nel
# capitale impegnabile: il conto sale a gradini e i gradini non si ripercorrono.
profit_lock:
  enabled: true
  threshold_usd: 95
  reinvest_pct: 0.0              # 0 = niente reinvestito; 1 = comportamento vecchio

# --- Guardrail ----------------------------------------------------------
guardrails:
  max_consecutive_api_errors: 3
  # Dei 3 crediti PDT se ne usano solo 2: il terzo resta di RISERVA per le
  # uscite d'emergenza. Senza, una posizione swing che crolla il giorno stesso
  # in cui e' stata aperta non potrebbe essere chiusa senza far marcare il
  # conto come Pattern Day Trader, con blocco di 90 giorni.
  day_trades_usable: 2
  day_trades_total: 3
  max_drawdown_from_peak_pct: 0.35   # le opzioni oscillano: freno largo
  # RIPARTENZA DEL FRENO (2026-09-15). Prima, scattato il freno, il conto non
  # poteva piu' risalire: servono operazioni, e il freno le vieta. Ora, dopo
  # questi giorni a conto piatto, si riparte dal capitale rimasto. 0 = mai.
  rearm_after_days: 3
  # PAUSA SULLO STESSO TITOLO dopo una chiusura in perdita. SLV venduto in
  # perdita e ricomprato 75 minuti dopo ha perso altri $150.
  reentry_cooldown_days: 3
  max_orders_per_tick: 4

# --- Sessione (2026-09-15) -----------------------------------------------
# Gli orari si leggono dal CALENDARIO DELLA BORSA, non dall'orologio italiano:
# quando Europa e Stati Uniti cambiano ora in date diverse New York chiude alle
# 21:00 italiane, e nelle mezze giornate alle 19:00. Un orario fisso alle 21:40
# avrebbe lasciato aperte di notte proprio le posizioni intraday.
session:
  close_minutes_before_close: 35         # finestra finale: si chiude, non si apre
  market_order_minutes_before_close: 10  # ultimo tentativo: a mercato, non a limite
  # NIENTE OPZIONI A MERCATO CHIUSO PIU' DI UNA NOTTE. Lo stop e' un controllo
  # del programma e nel weekend non agisce: INTC ha aperto il lunedi' gia'
  # sotto lo stop ed e' uscita a -68% invece di -50%. Prima di un weekend o di
  # una festivita' si chiude tutto, e in quella sessione non si apre swing.
  # Le notti infrasettimanali restano scoperte: li' protegge il tetto al 25%.
  flat_before_long_closure: true

# --- Orari (CET) --------------------------------------------------------
schedule_cet:
  select: "15:35"                # dopo l'apertura di New York
  trade_every_minutes: 15
  # la chiusura intraday segue il calendario della borsa (blocco session)
  weekly_report: "Sat 11:00"

state:
  dir: state/options
  files:
    selection: state/options/selection.json
    positions: state/options/positions.json
    log: state/options/executions_log.json
